<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wemute 设置与功能入口</title>
<style>
  :root {
    --bg: #f2f5fb; --glow-1: #dbe4ff; --glow-2: #d5f2ec; --glow-3: #e7e1ff;
    --glass: rgba(255,255,255,.72); --side: rgba(246,248,252,.92); --card: #fff;
    --text: #141b2d; --body: #3b4459; --muted: #7d869b; --hair: rgba(30,45,90,.09);
    --cobalt: #2c4bf0; --teal: #0f8f7e; --violet: #6b4fe0; --amber: #b7791f; --rose: #c2366b; --sel: rgba(44,75,240,.1);
    --pill-shadow: 0 0 0 1px rgba(44,75,240,.16), 0 8px 18px -10px rgba(44,75,240,.55);
    --panel: 0 0 0 1px rgba(255,255,255,.95) inset, 0 30px 70px -40px rgba(40,60,130,.38);
    --font: ui-rounded, "SF Pro Rounded", -apple-system, "PingFang SC", sans-serif;
  }
  .dark {
    --bg: #0c1120; --glow-1: rgba(61,92,255,.3); --glow-2: rgba(20,170,150,.18); --glow-3: rgba(120,90,255,.2);
    --glass: rgba(24,30,50,.66); --side: rgba(18,23,38,.9); --card: #1c2336;
    --text: #f1f4fb; --body: #b6bfd3; --muted: #7d879f; --hair: rgba(255,255,255,.08);
    --cobalt: #9fb2ff; --teal: #5fe0cb; --violet: #b3a2ff; --amber: #f2c779; --rose: #ff9cc2; --sel: rgba(143,166,255,.15);
    --pill-shadow: 0 0 0 1px rgba(143,166,255,.28), 0 10px 22px -12px rgba(61,92,255,.9);
    --panel: 0 0 0 1px rgba(255,255,255,.07) inset, 0 30px 70px -40px rgba(0,0,0,.8);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #cfd3db; font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  .switch { position: sticky; top: 0; z-index: 50; display: flex; justify-content: center; gap: 8px; padding: 12px; background: rgba(207,211,219,.9); backdrop-filter: blur(10px); }
  .switch button { border: 0; border-radius: 999px; padding: 8px 16px; font: 600 14px -apple-system, "PingFang SC"; background: rgba(0,0,0,.07); cursor: pointer; }
  .switch button.on { background: #141b2d; color: #fff; }
  .frame { display: none; margin: 10px auto 60px; width: 1200px; }
  .frame.on { display: block; }
  .menubar { height: 28px; display: flex; align-items: center; gap: 20px; padding: 0 16px; background: rgba(240,242,246,.86); border-radius: 12px 12px 0 0; font: 600 13px -apple-system, "PingFang SC"; color: #1b1f27; }
  .menubar b { font-weight: 800; }
  .menubar span.on { background: #2c4bf0; color: #fff; border-radius: 5px; padding: 1px 8px; margin: 0 -8px; }
  .desk { position: relative; height: 780px; border-radius: 0 0 12px 12px; overflow: hidden; background: linear-gradient(135deg, #8aa1d6, #b9c6e3 40%, #a8d3cc); }

  .win { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 .5px rgba(0,0,0,.3), 0 30px 70px -20px rgba(0,0,0,.45); color: var(--body); background:
      radial-gradient(700px 400px at 10% -10%, var(--glow-1), transparent 70%),
      radial-gradient(600px 400px at 100% 0%, var(--glow-2), transparent 70%),
      radial-gradient(800px 500px at 60% 120%, var(--glow-3), transparent 72%), var(--bg); }
  .lights { position: absolute; top: 16px; left: 16px; display: flex; gap: 8px; z-index: 3; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; } .lights i:nth-child(1){background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}

  /* main window */
  .main { left: 40px; top: 40px; width: 1120px; height: 700px; }
  .toolbar { position: absolute; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: center; }
  .toolbar .title { font-weight: 800; font-size: 14px; color: var(--text); }
  .tb-right { position: absolute; right: 14px; top: 10px; display: flex; gap: 6px; }
  .tb { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 10px; background: var(--card); box-shadow: 0 0 0 1px var(--hair); font-weight: 700; font-size: 13px; color: var(--text); }
  .tb.icon { padding: 0 9px; }
  .tb kbd { font: 600 11px var(--font); color: var(--muted); }
  .panel { position: absolute; inset: 56px 22px 22px; border-radius: 26px; background: var(--glass); box-shadow: var(--panel); padding: 30px 34px; }
  .hero { display: flex; align-items: center; gap: 24px; }
  .bubble { flex: none; width: 92px; height: 92px; border-radius: 28px; background: var(--card); box-shadow: 0 18px 40px -18px rgba(44,75,240,.55), 0 0 0 1px var(--hair); display: grid; place-items: center; transform: rotate(-6deg); color: var(--cobalt); font-size: 40px; }
  .hero h1 { margin: 0; font-size: 28px; color: var(--text); letter-spacing: -.01em; }
  .hero p { margin: 4px 0 0; font-size: 15px; color: var(--muted); font-weight: 600; }
  .hero .choose { margin-left: auto; display: inline-flex; align-items: center; height: 50px; padding: 0 24px; border-radius: 18px; background: linear-gradient(180deg,#3d5cff,#2440e8); color: #fff; font-weight: 750; font-size: 16px; box-shadow: 0 14px 28px -12px rgba(44,75,240,.75); }
  h3 { margin: 26px 0 10px; font-size: 13px; font-weight: 800; letter-spacing: .05em; color: var(--muted); }
  .kinds { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; }
  .kind { padding: 12px 10px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--hair); text-align: center; }
  .kind .g { width: 34px; height: 34px; margin: 0 auto 6px; border-radius: 11px; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .kind b { display: block; font-size: 14px; color: var(--text); }
  .kind small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tool { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--hair); }
  .tool .g { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; }
  .tool b { display: block; font-size: 14px; color: var(--text); }
  .tool small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .tool.hl { box-shadow: 0 0 0 2px var(--cobalt), 0 12px 24px -14px rgba(44,75,240,.6); }
  .tip { position: absolute; left: 100px; top: 668px; width: 300px; padding: 12px 14px; border-radius: 14px; background: #141b2d; color: #fff; font-size: 13px; font-weight: 600; box-shadow: 0 18px 40px -16px rgba(0,0,0,.5); }
  .dark .tip { background: #2a3352; }

  /* tools menu */
  .menu { position: absolute; z-index: 5; width: 300px; padding: 8px; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--hair), 0 30px 60px -20px rgba(20,30,70,.45); }
  .menu .sec { padding: 8px 10px 4px; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--muted); }
  .menu .it { display: flex; justify-content: space-between; padding: 7px 10px; border-radius: 9px; font-size: 14px; font-weight: 650; color: var(--text); }
  .menu .it span { color: var(--muted); font-size: 12px; }
  .menu .it.on { background: var(--sel); color: var(--cobalt); }

  /* command palette */
  .palette { position: absolute; left: 300px; top: 140px; width: 560px; border-radius: 18px; background: var(--card); box-shadow: 0 0 0 1px var(--hair), 0 40px 80px -24px rgba(20,30,70,.55); overflow: hidden; z-index: 6; }
  .palette .q { display: flex; align-items: center; gap: 10px; padding: 16px 18px; font-size: 18px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--hair); }
  .palette .q i { color: var(--muted); font-style: normal; }
  .palette .r { display: flex; align-items: center; gap: 12px; padding: 10px 18px; font-size: 15px; font-weight: 650; color: var(--text); }
  .palette .r small { margin-left: auto; color: var(--muted); font-weight: 600; font-size: 12px; }
  .palette .r.on { background: var(--sel); }
  .palette .g { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; }

  /* settings window */
  .settings { left: 170px; top: 60px; width: 860px; height: 620px; display: grid; grid-template-columns: 220px 1fr; }
  .sside { background: var(--side); box-shadow: 1px 0 0 var(--hair); padding: 54px 12px 16px; }
  .sside a { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 12px; border-radius: 10px; font-size: 14px; font-weight: 700; color: var(--body); text-decoration: none; }
  .sside a i { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-style: normal; font-size: 13px; color: #fff; }
  .sside a.on { background: var(--sel); color: var(--text); }
  .scontent { padding: 22px 30px; overflow: hidden; }
  .scontent h2 { margin: 18px 0 18px; font-size: 22px; color: var(--text); }
  .group { border-radius: 16px; background: var(--card); box-shadow: 0 0 0 1px var(--hair); margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
  .row:last-child { border-bottom: 0; }
  .row .l b { display: block; font-size: 14px; color: var(--text); }
  .row .l small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
  .row .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--hair); }
  .seg span { padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--body); }
  .seg span.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tog { width: 40px; height: 24px; border-radius: 12px; background: var(--cobalt); position: relative; }
  .tog::after { content: ""; position: absolute; right: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; }
  .tog.off { background: var(--hair); } .tog.off::after { right: auto; left: 3px; }
  .pick { padding: 6px 12px; border-radius: 10px; background: var(--card); box-shadow: var(--pill-shadow); font-weight: 750; font-size: 13px; color: var(--cobalt); }
  .appear { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 18px; }
  .ap { text-align: center; font-size: 13px; font-weight: 700; color: var(--body); }
  .ap .thumb { height: 96px; border-radius: 12px; margin-bottom: 8px; box-shadow: 0 0 0 1px var(--hair); overflow: hidden; position: relative; }
  .ap.on .thumb { box-shadow: 0 0 0 3px var(--cobalt); }
  .ap.on { color: var(--cobalt); }
  .t-light { background: linear-gradient(135deg,#eef2ff,#e3f5f1); }
  .t-dark { background: linear-gradient(135deg,#141a30,#0f2a2a); }
  .t-auto { background: linear-gradient(135deg,#eef2ff 0 50%,#141a30 50% 100%); }
  .thumb .mini { position: absolute; inset: 14px 18px; border-radius: 9px; background: rgba(255,255,255,.75); }
  .t-dark .mini { background: rgba(40,48,72,.85); }
  .thumb .mini::before { content: ""; position: absolute; left: 10px; top: 10px; width: 60%; height: 8px; border-radius: 4px; background: rgba(44,75,240,.5); }
  .thumb .mini::after { content: ""; position: absolute; left: 10px; top: 26px; width: 40%; height: 8px; border-radius: 4px; background: rgba(120,130,150,.4); }
  .fmt { display: grid; grid-template-columns: repeat(3,1fr); }
  .fmt .row { border-right: 1px solid var(--hair); }
</style>
</head>
<body>
<div class="switch">
  <button class="on" data-f="empty">主界面 · 一眼看到能做什么</button>
  <button data-f="tools">工具菜单</button>
  <button data-f="palette">⌘K 功能搜索</button>
  <button data-f="settings">设置 · 外观</button>
  <button data-f="settings2">设置 · 转换</button>
  <button data-f="dark">深色模式</button>
</div>

<template id="main">
  <div class="win main">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="toolbar"><span class="title">Wemute</span>
      <div class="tb-right"><span class="tb">＋ 添加文件</span><span class="tb">✦ 工具 ▾</span><span class="tb">⌕ <kbd>⌘K</kbd></span><span class="tb icon">⚙</span></div></div>
    <div class="panel">
      <div class="hero"><div class="bubble">⇩</div><div><h1>把文件拖到这里</h1><p>任何格式都可以，转换全部在这台 Mac 上完成</p></div><span class="choose">选择文件 →</span></div>
      <h3>能转换的文件</h3>
      <div class="kinds">
        <div class="kind"><div class="g" style="background:rgba(44,75,240,.12);color:var(--cobalt)">图</div><b>图片</b><small>HEIC JPG PNG</small></div>
        <div class="kind"><div class="g" style="background:rgba(15,143,126,.12);color:var(--teal)">▶</div><b>视频</b><small>MOV MP4 GIF</small></div>
        <div class="kind"><div class="g" style="background:rgba(107,79,224,.12);color:var(--violet)">♪</div><b>音频</b><small>WAV MP3 M4A</small></div>
        <div class="kind"><div class="g" style="background:rgba(44,75,240,.12);color:var(--cobalt)">W</div><b>文档</b><small>Word Pages</small></div>
        <div class="kind"><div class="g" style="background:rgba(15,143,126,.12);color:var(--teal)">▦</div><b>表格</b><small>Excel CSV</small></div>
        <div class="kind"><div class="g" style="background:rgba(194,54,107,.12);color:var(--rose)">P</div><b>PDF</b><small>转 Word 图片</small></div>
        <div class="kind"><div class="g" style="background:rgba(183,121,31,.14);color:var(--amber)">📖</div><b>电子书</b><small>EPUB MOBI</small></div>
        <div class="kind"><div class="g" style="background:rgba(107,79,224,.12);color:var(--violet)">⧉</div><b>压缩包</b><small>ZIP 7Z RAR</small></div>
        <div class="kind"><div class="g" style="background:rgba(120,130,150,.15);color:var(--body)">Aa</div><b>字体·数据</b><small>TTF JSON MD</small></div>
      </div>
      <h3>工具</h3>
      <div class="tools">
        <div class="tool hl"><div class="g" style="background:rgba(44,75,240,.12)">✂︎</div><div><b>去背景</b><small>抠出主体，透明 PNG</small></div></div>
        <div class="tool"><div class="g" style="background:rgba(107,79,224,.12)">◌</div><div><b>擦除</b><small>涂抹掉不想要的东西</small></div></div>
        <div class="tool"><div class="g" style="background:rgba(15,143,126,.12)">T</div><div><b>文字识别</b><small>截图、扫描件转文字</small></div></div>
        <div class="tool"><div class="g" style="background:rgba(194,54,107,.12)">▭</div><div><b>扫描矫正</b><small>拍的纸质文件拉平</small></div></div>
        <div class="tool"><div class="g" style="background:rgba(183,121,31,.14)">☺</div><div><b>人脸打码</b><small>分享前模糊人脸</small></div></div>
        <div class="tool"><div class="g" style="background:rgba(44,75,240,.12)">▣</div><div><b>证件照换底</b><small>白底、蓝底、红底</small></div></div>
        <div class="tool"><div class="g" style="background:rgba(15,143,126,.12)">⧈</div><div><b>合成 PDF</b><small>多张图片变一个 PDF</small></div></div>
        <div class="tool"><div class="g" style="background:rgba(107,79,224,.12)">≋</div><div><b>生成字幕</b><small>通过 ThunderTalk</small></div></div>
      </div>
    </div>
  </div>
</template>

<div class="frame on" id="empty"><div class="menubar"><b></b><b>Wemute</b><span>文件</span><span>编辑</span><span>显示</span><span>工具</span><span>窗口</span><span>帮助</span></div><div class="desk"></div></div>
<div class="frame" id="tools"><div class="menubar"><b></b><b>Wemute</b><span>文件</span><span>编辑</span><span>显示</span><span class="on">工具</span><span>窗口</span><span>帮助</span></div><div class="desk"></div></div>
<div class="frame" id="palette"><div class="menubar"><b></b><b>Wemute</b><span>文件</span><span>编辑</span><span>显示</span><span>工具</span><span>窗口</span><span>帮助</span></div><div class="desk"></div></div>
<div class="frame" id="settings"><div class="menubar"><b></b><b>Wemute</b><span>文件</span><span>编辑</span><span>显示</span><span>工具</span><span>窗口</span><span>帮助</span></div><div class="desk"></div></div>
<div class="frame" id="settings2"><div class="menubar"><b></b><b>Wemute</b><span>文件</span><span>编辑</span><span>显示</span><span>工具</span><span>窗口</span><span>帮助</span></div><div class="desk"></div></div>
<div class="frame" id="dark"><div class="menubar"><b></b><b>Wemute</b><span>文件</span><span>编辑</span><span>显示</span><span>工具</span><span>窗口</span><span>帮助</span></div><div class="desk"></div></div>

<script>
  const T = (id) => document.getElementById(id).content.cloneNode(true);
  const desk = (id) => document.querySelector(`#${id} .desk`);
  desk("empty").appendChild(T("main"));
  desk("empty").insertAdjacentHTML("beforeend", `<div class="tip">点一个工具，Wemute 会告诉你拖什么进来：<br>「去背景 · 拖入照片就会抠出主体」</div>`);

  desk("tools").appendChild(T("main"));
  desk("tools").insertAdjacentHTML("beforeend", `<div class="menu" style="left:330px;top:0">
    <div class="sec">转换</div><div class="it">转成 PDF…<span>⌘P</span></div><div class="it">合成一个 PDF</div><div class="it">打包成 ZIP</div>
    <div class="sec">图片工具</div><div class="it on">去背景</div><div class="it">擦除…</div><div class="it">文字识别（OCR）</div><div class="it">扫描矫正</div><div class="it">人脸打码</div><div class="it">证件照换底</div><div class="it">智能裁剪</div><div class="it">挑出模糊和重复</div>
    <div class="sec">音视频</div><div class="it">生成字幕（ThunderTalk）</div><div class="it">文字转语音（ThunderTalk）</div>
    <div class="sec">更多</div><div class="it">安装 Finder 右键操作…</div></div>`);

  desk("palette").appendChild(T("main"));
  desk("palette").insertAdjacentHTML("beforeend", `<div class="palette"><div class="q"><i>⌕</i>转 pdf</div>
    <div class="r on"><span class="g" style="background:rgba(44,75,240,.12)">W</span>把 Word 文档转成 PDF<small>文档</small></div>
    <div class="r"><span class="g" style="background:rgba(15,143,126,.12)">⧈</span>把图片合成一个 PDF<small>图片</small></div>
    <div class="r"><span class="g" style="background:rgba(194,54,107,.12)">P</span>合并多个 PDF<small>PDF</small></div>
    <div class="r"><span class="g" style="background:rgba(15,143,126,.12)">T</span>扫描件转可搜索 PDF<small>文字识别</small></div>
    <div class="r"><span class="g" style="background:rgba(183,121,31,.14)">📖</span>电子书转 PDF<small>电子书</small></div></div>`);

  function settings(id, page) {
    const d = desk(id);
    d.appendChild(T("main"));
    const nav = [["通用","#2c4bf0","⚙"],["外观","#6b4fe0","◐"],["转换","#0f8f7e","⇄"],["组件","#b7791f","⧉"],["集成","#c2366b","⌘"],["关于","#7d869b","i"]];
    const body = page === "appearance" ? `
      <h2>外观</h2>
      <div class="group"><div class="appear">
        <div class="ap on"><div class="thumb t-auto"><div class="mini"></div></div>跟随系统</div>
        <div class="ap"><div class="thumb t-light"><div class="mini"></div></div>浅色</div>
        <div class="ap"><div class="thumb t-dark"><div class="mini"></div></div>深色</div></div></div>
      <div class="group">
        <div class="row"><div class="l"><b>语言</b><small>界面文字</small></div><div class="r"><span class="seg"><span class="on">跟随系统</span><span>中文</span><span>English</span></span></div></div>
        <div class="row"><div class="l"><b>减少动效</b><small>卡片不倾斜、不漂动</small></div><div class="r"><span class="tog off"></span></div></div>
      </div>` : `
      <h2>转换</h2>
      <div class="group">
        <div class="row"><div class="l"><b>保存位置</b><small>原文件不会被修改或覆盖</small></div><div class="r"><span class="seg"><span class="on">原文件旁</span><span>指定文件夹…</span></span></div></div>
        <div class="row"><div class="l"><b>文件命名</b><small>例：IMG_0412.jpg</small></div><div class="r"><span class="seg"><span class="on">保持原名</span><span>加后缀</span></span></div></div>
        <div class="row"><div class="l"><b>添加后自动开始</b></div><div class="r"><span class="tog off"></span></div></div>
        <div class="row"><div class="l"><b>完成后在访达中显示</b></div><div class="r"><span class="tog"></span></div></div>
      </div>
      <h2 style="margin-top:22px">默认格式</h2>
      <div class="group fmt">
        <div class="row"><div class="l"><b>图片</b></div><div class="r"><span class="pick">JPG</span></div></div>
        <div class="row"><div class="l"><b>视频</b></div><div class="r"><span class="pick" style="color:var(--teal)">MP4</span></div></div>
        <div class="row"><div class="l"><b>音频</b></div><div class="r"><span class="pick" style="color:var(--violet)">MP3</span></div></div>
        <div class="row"><div class="l"><b>文档</b></div><div class="r"><span class="pick">PDF</span></div></div>
        <div class="row"><div class="l"><b>表格</b></div><div class="r"><span class="pick" style="color:var(--teal)">XLSX</span></div></div>
        <div class="row"><div class="l"><b>PDF</b></div><div class="r"><span class="pick" style="color:var(--rose)">DOCX</span></div></div>
      </div>`;
    d.insertAdjacentHTML("beforeend", `<div class="win settings"><div class="lights"><i></i><i></i><i></i></div>
      <div class="sside">${nav.map(([n,c,g]) => `<a class="${(page==="appearance"&&n==="外观")||(page!=="appearance"&&n==="转换")?"on":""}"><i style="background:${c}">${g}</i>${n}</a>`).join("")}</div>
      <div class="scontent">${body}</div></div>`);
  }
  settings("settings", "appearance");
  settings("settings2", "convert");
  desk("dark").appendChild(T("main"));
  desk("dark").querySelector(".win").classList.add("dark");
  for (const b of document.querySelectorAll(".switch button")) b.onclick = () => {
    document.querySelectorAll(".switch button").forEach((x) => x.classList.toggle("on", x === b));
    document.querySelectorAll(".frame").forEach((f) => f.classList.toggle("on", f.id === b.dataset.f));
  };
</script>
