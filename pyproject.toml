[project]
name = "wemute"
version = "0.4.0"
description = "A local-first, cross-platform file conversion workspace."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Wemute" }]
dependencies = [
  "numpy>=2.1,<3",
  "onnxruntime>=1.20,<2",
  "Pillow>=11.1,<13",
  "PySide6>=6.8,<6.11",
  "platformdirs>=4.3,<5",
  "demucs-mlx==1.4.6 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
  "pyobjc-framework-vision>=11 ; sys_platform == 'darwin'",
  "pyobjc-framework-quartz>=11 ; sys_platform == 'darwin'",
  "pypdfium2>=4.30,<6",
  "pikepdf>=9,<11",
  "pdf2docx>=0.5.8,<0.6",
  "openpyxl>=3.1,<4",
  "fonttools[woff]>=4.55,<5",
  "brotli>=1.1,<2",
  "py7zr>=0.22,<2",
  "markdown>=3.7,<4",
  "python-docx>=1.1,<2",
  "pyobjc-framework-quicklookthumbnailing>=11 ; sys_platform == 'darwin'",
]

[project.gui-scripts]
wemute = "wemute.app:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "python-pptx>=1.0,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wemute"]

[tool.hatch.build]
include = [
  "src/wemute/qml/**",
  "src/wemute/assets/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["wemute"]
