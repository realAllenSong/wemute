[project]
name = "wemute"
version = "0.3.0"
description = "A local-first, cross-platform file conversion workspace."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Wemute" }]
dependencies = [
  "numpy>=2.1,<3",
  "onnxruntime>=1.20,<2",
  "Pillow>=11.1,<13",
  "PySide6>=6.8,<6.11",
  "platformdirs>=4.3,<5",
]

[project.gui-scripts]
wemute = "wemute.app:main"

[dependency-groups]
dev = [
  "pyinstaller>=6.12,<7",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "QtAwesome>=1.4,<2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wemute"]

[tool.hatch.build]
include = [
  "src/wemute/qml/**",
  "src/wemute/assets/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["wemute"]
